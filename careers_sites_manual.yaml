# Careers sites added by hand. These override what discover_careers finds.
# platform: workday | oracle | greenhouse | lever | ashby | smartrecruiters
# id formats:
#   workday:  <tenant>.<wdN>/<site>       from https://<tenant>.<wdN>.myworkdayjobs.com/<site>
#   oracle:   <host>/<site number>        from https://<host>/hcmUI/CandidateExperience/en/sites/<site number>
#   greenhouse / lever / ashby / smartrecruiters: the board name in the URL
sites: []

# Matches that belong to a different company with the same name.
exclude:
  - {platform: ashby, id: unit}
  - {platform: ashby, id: pic}
  - {platform: greenhouse, id: iex}
  - {platform: ashby, id: artemis}
