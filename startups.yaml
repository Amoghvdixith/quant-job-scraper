# Quant and fintech startups whose open roles go in the "Startups" sheet. Only roles a recent
# graduate could get are kept (see `startups` in config.yaml).
#
# name:   the startup's name
# focus:  what it does (shown in the sheet)
# stage:  funding stage, as you want it shown
# hq:     headquarters
# board:  its job board, when known: {platform: greenhouse | lever | ashby | smartrecruiters, id: <board name>}
#         (the name in https://boards.greenhouse.io/<id>, https://jobs.lever.co/<id>, https://jobs.ashbyhq.com/<id>).
#         Leave it out and the board is looked up by name on each platform, a few startups per run.
#         Use `board: none` for a startup with no public board, or when the lookup finds the wrong company.
#
# Boards marked "checked" were confirmed to belong to that startup on 12 Nov 2026.
startups:
  # Trading, market making and market data
  - {name: Wintermute, focus: Algorithmic trading and market making in digital assets, stage: Private (profitable), hq: London,
     board: {platform: lever, id: wintermute-trading}}   # checked
