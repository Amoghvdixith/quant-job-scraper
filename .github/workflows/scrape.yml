name: Quant job digest

on:
  schedule:
    # GitHub often drops or delays scheduled runs at the top of the hour, so this checks
    # every hour (at :17) and only runs once 3h40m have passed since the last email.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email (untick for a test run that only uploads the Excel file)"
        type: boolean
        default: true
      chained:
        description: "Started by the previous run's timer (only emails if one is due)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: job-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Is an email due?
        id: due
        run: |
          due=true
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.chained }}" = "true" ]; } && [ -f data/last_email_utc ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$(cat data/last_email_utc)" +%s) ))
            [ "$age" -lt 13200 ] && due=false
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Email due: $due"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.due.outputs.due == 'true'

      - name: Scrape, build Excel, email
        if: steps.due.outputs.due == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" = "false" ]; then
            python -m jobscraper.main --no-email
          else
            python -m jobscraper.main
          fi

      - name: Keep the Excel file for 7 days
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quant-jobs-excel
          path: out/*.xlsx
          retention-days: 7
          if-no-files-found: ignore

      - name: Save which jobs were already emailed
        if: success() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/jobs.json data/last_run.json data/sponsor_registers.json
          [ -f data/last_email_utc ] && git add data/last_email_utc
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase --autostash || true
          git push

  # GitHub's own schedule skips many runs for this repo, so each run also starts the next
  # one itself: this job waits until 4 hours after the last email, then triggers the
  # workflow again. Only one timer runs at a time (a newer one replaces an older one);
  # the hourly schedule above restarts the chain if it ever breaks.
  timer:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: chain-timer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait until the next email is due
        run: |
          git pull -q origin main || true
          last=$(date -u -d "$(cat data/last_email_utc 2>/dev/null || date -u +%FT%TZ)" +%s)
          wait=$(( last + 14400 - $(date -u +%s) ))
          [ "$wait" -lt 600 ] && wait=600
          echo "Next run in $((wait / 60)) minutes"
          sleep "$wait"
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref main -f send_email=true -f chained=true
