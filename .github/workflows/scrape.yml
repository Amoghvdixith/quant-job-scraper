name: Quant job digest

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours, every day (UTC)
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email (untick for a test run that only uploads the Excel file)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape, build Excel, email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" = "false" ]; then
            python -m jobscraper.main --no-email
          else
            python -m jobscraper.main
          fi

      - name: Keep the Excel file for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-jobs-excel
          path: out/*.xlsx
          retention-days: 7
          if-no-files-found: ignore

      - name: Save which jobs were already emailed
        if: success()
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase --autostash || true
          git push
