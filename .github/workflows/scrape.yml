name: Quant job digest

on:
  schedule:
    # GitHub often drops or delays scheduled runs at the top of the hour, so this checks
    # every hour (at :17) and only runs once 3h40m have passed since the last email.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email (untick for a test run that only uploads the Excel file)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Is an email due?
        id: due
        run: |
          due=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/last_email_utc ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$(cat data/last_email_utc)" +%s) ))
            [ "$age" -lt 13200 ] && due=false
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Email due: $due"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.due.outputs.due == 'true'

      - name: Scrape, build Excel, email
        if: steps.due.outputs.due == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" = "false" ]; then
            python -m jobscraper.main --no-email
          else
            python -m jobscraper.main
          fi

      - name: Keep the Excel file for 7 days
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quant-jobs-excel
          path: out/*.xlsx
          retention-days: 7
          if-no-files-found: ignore

      - name: Save which jobs were already emailed
        if: success() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/jobs.json data/last_run.json data/sponsor_registers.json
          [ -f data/last_email_utc ] && git add data/last_email_utc
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase --autostash || true
          git push
