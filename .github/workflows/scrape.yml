name: Quant job digest

on:
  schedule:
    # Emails go out at email_times in config.yaml. Each run starts the next one itself (see
    # the timer job). This hourly check is a backup: it only scrapes when a slot was missed.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email (untick for a test run that only uploads the Excel file)"
        type: boolean
        default: true
      chained:
        description: "Started by the previous run's timer (only emails if one is due)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: job-digest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Is an email due?
        id: due
        run: |
          git pull -q origin main || true   # another run may have emailed while this one waited
          due=true
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.chained }}" = "true" ]; then
            due=$(python -m jobscraper.schedule due)
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Email due: $due"

      - name: Scrape, build Excel, email
        if: steps.due.outputs.due == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" = "false" ]; then
            python -m jobscraper.main --no-email
          else
            python -m jobscraper.main
          fi

      - name: Keep the Excel file for 7 days
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quant-jobs-excel
          path: out/*.xlsx
          retention-days: 7
          if-no-files-found: ignore

      - name: Save which jobs were already emailed
        if: success() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/jobs.json data/last_run.json data/sponsor_registers.json
          [ -f data/last_email_utc ] && git add data/last_email_utc
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase --autostash || true
          git push

  # GitHub's own schedule skips many runs for this repo, so each run also starts the next
  # one itself: this job waits until the next slot in email_times, then triggers the
  # workflow again. Only one timer runs at a time (a newer one replaces an older one);
  # the hourly schedule above restarts the chain if it ever breaks.
  timer:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: chain-timer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Wait until the next run is due
        run: |
          git pull -q origin main || true
          wait=$(python -m jobscraper.schedule wait)
          echo "Next run in $((wait / 60)) minutes"
          sleep "$wait"
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref main -f send_email=true -f chained=true
