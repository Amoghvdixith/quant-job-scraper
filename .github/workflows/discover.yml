name: Find careers sites

on:
  schedule:
    - cron: "30 2 * * 0"   # weekly, Sunday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: find-careers-sites   # separate from the digest, so a late discovery run never delays an email
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m jobscraper.discover_careers
      - run: python -m jobscraper.sponsor_registers
      - name: Save the list
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/careers_sites.json data/careers_report.json data/sponsor_registers.json
          [ -f data/sponsor_details.json ] && git add data/sponsor_details.json
          [ -f data/uk_cos.json ] && git add data/uk_cos.json
          git diff --cached --quiet && exit 0
          git commit -m "Update careers sites [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Could not save the careers sites list"
          exit 1
