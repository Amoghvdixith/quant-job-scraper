name: Find careers sites

on:
  schedule:
    - cron: "30 2 * * 0"   # weekly, Sunday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m jobscraper.discover_careers
      - name: Save the list
        run: |
          git config user.name "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add data/careers_sites.json
          git diff --cached --quiet || git commit -m "Update careers sites [skip ci]"
          git pull --rebase --autostash || true
          git push
