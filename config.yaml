# Search settings. Secrets (Gmail login, recipient) live in GitHub Actions secrets, not here.

# Only keep postings published within this many days.
max_age_days: 5

# Sources to search. Remove one to switch it off.
sources: [linkedin, google, efinancialcareers, indeed, careers]

# LinkedIn location filter. "Worldwide" covers every country; add specific
# countries (e.g. "United Kingdom", "Singapore") to get more results there.
linkedin_locations: [Worldwide]
# Countries searched on top of Worldwide, a few per run in rotation
# (Worldwide alone stops at ~1,000 results, mostly from the biggest markets).
linkedin_rotating_locations:
  - United Kingdom
  - United States
  - Singapore
  - Hong Kong SAR
  - Ireland
  - Germany
  - Netherlands
  - Switzerland
  - France
  - Luxembourg
  - Canada
  - Australia
  - Japan
  - Poland
  - Belgium
  - Spain
  - Italy
  - Austria
  - Sweden
  - Denmark
  - Norway
  - Finland
  - Portugal
  - Czechia
  - Hungary
  - Romania
  - China
  - Taiwan
  - South Korea
  - Malaysia
  - New Zealand
  - South Africa
  - Brazil
  - Mexico
linkedin_locations_per_run: 6
# Firms from institutions.csv searched by name on LinkedIn each run (those without
# a careers site we can read directly). 80 per run covers the list about every day.
linkedin_target_firms_per_run: 80
linkedin_target_firm_pages: 2
# LinkedIn experience levels: 1 = Internship, 2 = Entry level, 3 = Associate.
linkedin_experience_levels: [1, 2, 3]
# Result pages fetched per search (LinkedIn returns ~10 jobs per page).
linkedin_max_pages: 3

# Google Jobs: one search per role title (not every keyword) to avoid being blocked.
google_results_per_search: 20

# Indeed: countries searched, a few per run in rotation (names as Indeed uses them).
indeed_countries: [uk, usa, singapore, hong kong, ireland, germany, netherlands, switzerland,
                   france, luxembourg, canada, australia, japan, poland, belgium, spain,
                   italy, austria, sweden, denmark, norway, finland, portugal, czech republic,
                   new zealand, south africa, malaysia, brazil, mexico]
indeed_countries_per_run: 5
indeed_results_per_search: 30

# eFinancialCareers: result pages per keyword.
efc_max_pages: 2

# Postings in these countries are dropped (India and the Middle East). Matched against the location
# text; a name ending in "$" only counts as the country, the last part of the location.
excluded_locations:
  - India
  - United Arab Emirates
  - UAE
  - Saudi Arabia
  - KSA
  - Riyadh
  - Jeddah
  - Dammam
  - Khobar
  - Qatar
  - Doha
  - Kuwait
  - Bahrain
  - Manama
  - "Oman$"   # only as the country ("Oman Road" etc.)
  - Muscat
  - Israel
  - Tel Aviv
  - Tel Aviv-Yafo
  - Jerusalem
  - Haifa
  - Herzliya
  - "Jordan$"   # only as the country (there are US towns called Jordan)
  - Amman
  - "Lebanon$"   # only as the country (there are US towns called Lebanon)
  - Beirut
  - Iraq
  - Baghdad
  - Erbil
  - Iran
  - Tehran
  - Syria
  - Yemen
  - Palestine
  - Middle East
  - MENA
  - GCC
  - Dubai
  - Abu Dhabi
  - Sharjah
  - Ajman
  - Ras Al Khaimah
  - Bengaluru
  - Bangalore
  - Mumbai
  - Pune
  - Hyderabad
  - Chennai
  - Gurugram
  - Gurgaon
  - Noida
  - New Delhi
  - Delhi
  - Kolkata
  - Ahmedabad
  - Jaipur
  - Kochi
  - Coimbatore
  - Indore
  - Chandigarh
  - Thiruvananthapuram
  - Vadodara
  - Mohali

# Titles containing any of these words are treated as too senior and dropped.
senior_title_words:
  - senior
  - sr
  - lead
  - head
  - director
  - vp
  - svp
  - evp
  - md
  - avp
  - vice president
  - principal
  - manager
  - staff
  - chief
  - executive director
  - managing director
  - expert
  - experienced
  - partner
  - supervisor
  # Levels like "Analyst II" usually want a few years' experience.
  - ii
  - iii
  - iv

# Drop postings whose description asks for more than this many years of experience.
max_years_experience: 2

# Drop postings that ask for a professional qualification (CA, ACA, ACCA, CIMA, CPA, CFA, FRM,
# PRM, CQF, CAIA, actuarial and similar), whether required or "preferred". Postings where the
# employer offers to train you for one (e.g. a graduate scheme that pays for the ACA) are kept.
exclude_professional_qualifications: true

# Visa sponsorship. Postings that say "no sponsorship" are always dropped. Then:
#   posting_or_employer: keep if the posting offers sponsorship, or the employer is on the
#                        government sponsor list for the job's country (UK, US H-1B, Netherlands);
#                        in other countries, an employer on any of those lists counts
#   posting_only:        keep only postings that explicitly offer sponsorship
#   lenient:             keep everything else too
sponsorship_filter: posting_or_employer

# When the email should arrive (UK time, so it follows the clock change). Each run starts
# run_lead_minutes earlier, because scraping takes 35-50 minutes.
email_times: ["00:00", "05:00", "11:00", "17:00", "23:00"]
email_timezone: Europe/London
run_lead_minutes: 55
